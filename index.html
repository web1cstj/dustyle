<!DOCTYPE html>
<html lang="fr">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Dustyle - Accueil</title>
	<style>
		body {
			font-family: Arial, sans-serif;
			margin: 0;
			padding: 20px;
			background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
			min-height: 100vh;
			display: flex;
			justify-content: center;
			align-items: center;
		}
		
		.container {
			background: white;
			border-radius: 15px;
			padding: 40px;
			box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
			text-align: center;
			max-width: 600px;
		}
		
		h1 {
			color: #333;
			margin-bottom: 10px;
			font-size: 2.5em;
		}
		
		.subtitle {
			color: #666;
			margin-bottom: 40px;
			font-size: 1.2em;
		}
		
		.links-container {
			display: flex;
			gap: 30px;
			justify-content: center;
			flex-wrap: wrap;
		}
		
		.link-card {
			background: linear-gradient(45deg, #ff6b6b, #ee5a52);
			border-radius: 10px;
			padding: 30px 20px;
			text-decoration: none;
			color: white;
			transition: transform 0.3s ease, box-shadow 0.3s ease;
			min-width: 200px;
			box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
		}
		
		.link-card:hover {
			transform: translateY(-5px);
			box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
		}
		
		.link-card.bonbon {
			background: linear-gradient(45deg, #ff9a9e, #fecfef);
		}
		
		.link-card.casque {
			background: linear-gradient(45deg, #a8edea, #fed6e3);
		}
		
		.link-title {
			font-size: 1.5em;
			font-weight: bold;
			margin-bottom: 10px;
		}
		
		.link-description {
			font-size: 0.9em;
			opacity: 0.9;
		}
		
		.footer {
			margin-top: 40px;
			color: #666;
			font-size: 0.9em;
		}
	</style>
</head>
<body>
	<div class="container">
		<h1>Dustyle</h1>
		<p class="subtitle">Découvrez nos créations CSS</p>
		
		<div class="links-container">
			<a href="casque.html" class="link-card casque">
				<div class="link-title">🎧 Casque</div>
				<div class="link-description">Explorez le design du casque</div>
			</a>
			<a href="bonbon.html" class="link-card bonbon">
				<div class="link-title">🍭 Bonbon</div>
				<div class="link-description">Le CSS, c'est du bonbon</div>
			</a>
			
		</div>
		
		<div class="footer">
			<p>Cliquez sur une carte pour accéder à la page correspondante</p>
		</div>
	</div>
</body>
</html>
